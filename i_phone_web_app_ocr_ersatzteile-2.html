<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OCR Ersatzteile</title>

<script src="tesseract.min.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0a0a0a;
  color:#fff;
  touch-action:none;
}

#topStatus {
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 12px;
  border-radius:10px;
  background:rgba(0,0,0,0.6);
  font-size:14px;
  z-index:20;
  text-align:center;
  min-width:60%;
}

#videoContainer {
  position:relative;
  width:100vw;
  height:50vh;
  overflow:hidden;
  background:#000;
}

#video {
  width:100%;
  height:100%;
  object-fit:cover;
}

#overlay {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border:3px solid #E20612;
  border-radius:12px;
  width:60%;
  height:25%;
  pointer-events:none;
}

#controls {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(20,20,20,0.92);
  padding:12px;
}

.row { display:flex; gap:8px; }

input, button {
  width:100%; margin-top:6px;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
}

button { background:#E20612; color:white; }
.qtyBtn { flex:1; background:#333; }

#history { max-height:90px; overflow:auto; font-size:12px; margin-top:6px; }
.item { border-bottom:1px solid #333; padding:4px; }
</style>
</head>
<body>

<div id="topStatus">Bereit</div>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <div id="overlay"></div>
</div>

<div id="controls">
  <button onclick="toggleCamera()">Kamera EIN/AUS</button>

  <input id="manual" placeholder="Bestellnummer">

  <div class="row">
    <input id="qty" type="number" placeholder="Menge">
    <button class="qtyBtn" onclick="setQty(10)">10</button>
    <button class="qtyBtn" onclick="setQty(50)">50</button>
    <button class="qtyBtn" onclick="setQty(100)">100</button>
  </div>

  <button onclick="scan()">Scannen</button>
  <button onclick="submitData()">Senden</button>

  <div id="history"></div>
</div>

<script>
let video=document.getElementById('video');
let status=document.getElementById('topStatus');

let stream=null;
let buffer=JSON.parse(localStorage.getItem('buffer')||'[]');
let history=JSON.parse(localStorage.getItem('history')||'[]');

const items={"420-098.001-013":"Schraube M1.7 xyz69"};

function setQty(v){document.getElementById('qty').value=v;}

function updateHistory(){
  const el=document.getElementById('history');
  el.innerHTML=history.slice(-10).reverse().map(i=>
    `<div class='item'>${i.number} | ${i.qty}</div>`
  ).join('');
}
updateHistory();

async function toggleCamera(){
  try{
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
      video.srcObject=null;
      status.innerText="Kamera aus";
      return;
    }

    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream;

    await video.play();
    status.innerText="Kamera aktiv";
  }catch(e){
    status.innerText="Kamera Fehler";
  }
}

function getCropCanvas(){
  const rect=document.getElementById('overlay').getBoundingClientRect();
  const vRect=video.getBoundingClientRect();

  if(!video.videoWidth) return null;

  const sx=video.videoWidth/vRect.width;
  const sy=video.videoHeight/vRect.height;

  const c=document.createElement('canvas');
  c.width=rect.width*sx;
  c.height=rect.height*sy;

  const ctx=c.getContext('2d');
  ctx.drawImage(video,
    (rect.left-vRect.left)*sx,
    (rect.top-vRect.top)*sy,
    rect.width*sx,
    rect.height*sy,
    0,0,c.width,c.height);

  return c;
}

function preprocess(canvas){
  const ctx=canvas.getContext('2d');
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);

  for(let i=0;i<img.data.length;i+=4){
    const g=(img.data[i]+img.data[i+1]+img.data[i+2])/3;
    const v=g>160?255:0;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
  }
  ctx.putImageData(img,0,0);
  return canvas;
}

async function scan(){
  try{
    if(!stream){status.innerText="Kamera nicht aktiv";return;}
    if(typeof Tesseract==='undefined'){status.innerText="OCR nicht geladen";return;}

    let c=getCropCanvas();
    if(!c){status.innerText="kein Bild";return;}

    status.innerText="scanne...";

    c=preprocess(c);

    const res=await Tesseract.recognize(c,'eng',{
      tessedit_char_whitelist:'0123456789.-'
    });

    const text=(res.data.text||"").replace(/[^0-9.-]/g,'');
    const match=text.match(/\d{3}-\d{3}\.\d{3}-\d{3}/);

    if(match){
      document.getElementById('manual').value=match[0];
      status.innerText=items[match[0]]||"OK";
    }else{
      status.innerText="kein Treffer";
    }

  }catch(e){
    status.innerText="Scan Fehler";
  }
}

async function submitData(){
  const n=document.getElementById('manual').value;
  const q=document.getElementById('qty').value;

  if(!n||!q){status.innerText="fehlend";return;}

  const p={number:n,qty:q};

  history.push(p);
  localStorage.setItem('history',JSON.stringify(history));
  updateHistory();

  try{
    await fetch('YOUR_MS365_ENDPOINT',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(p)
    });
    status.innerText="gesendet";
  }catch(e){
    buffer.push(p);
    localStorage.setItem('buffer',JSON.stringify(buffer));
  }
}

setInterval(async()=>{
  if(buffer.length===0)return;
  try{
    const copy=[...buffer];
    buffer=[];
    localStorage.setItem('buffer','[]');

    for(const i of copy){
      await fetch('YOUR_MS365_ENDPOINT',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(i)
      });
    }
  }catch(e){
    localStorage.setItem('buffer',JSON.stringify(buffer));
  }
},10000);
</script>
</body>
</html>
