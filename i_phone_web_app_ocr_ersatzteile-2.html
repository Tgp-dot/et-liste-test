<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OCR Ersatzteile</title>

<script src="tesseract.min.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0a0a0a;
  color:#fff;
  touch-action:none;
}

#topStatus {
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 12px;
  border-radius:10px;
  background:rgba(0,0,0,0.6);
  font-size:14px;
  z-index:20;
  text-align:center;
  min-width:60%;
}

#videoContainer {
  position:relative;
  width:100vw;
  height:50vh;
  overflow:hidden;
  background:#000;
}

#video {
  width:100%;
  height:100%;
  object-fit:cover;
}

#overlay {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border:3px solid #E20612;
  border-radius:12px;
  width:60%;
  height:25%;
  pointer-events:none;
}

#controls {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(20,20,20,0.92);
  padding:12px;
}

.row { display:flex; gap:8px; }

input, button {
  width:100%; margin-top:6px;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
}

button { background:#E20612; color:white; }
.qtyBtn { flex:1; background:#333; }

#history { max-height:90px; overflow:auto; font-size:12px; margin-top:6px; }
.item { border-bottom:1px solid #333; padding:4px; }
</style>
</head>
<body>

<div id="topStatus">Bereit</div>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <div id="overlay"></div>
</div>

<div id="controls">
  <button onclick="toggleCamera()">Kamera EIN/AUS</button>

  <input id="manual" placeholder="Bestellnummer" style="width:100%">

  <div class="row">
    <input id="qty" type="number" placeholder="Menge">
    <button class="qtyBtn" onclick="setQty(10)">10</button>
    <button class="qtyBtn" onclick="setQty(50)">50</button>
    <button class="qtyBtn" onclick="setQty(100)">100</button>
  </div>

  <button onclick="scan()">Scannen</button>
  <button onclick="submitData()">Senden</button>

  <div id="history"></div>
</div>

<script>
let video=document.getElementById('video');
let overlay=document.getElementById('overlay');
let status=document.getElementById('topStatus');

let stream=null;
let track=null;

let buffer=JSON.parse(localStorage.getItem('buffer')||'[]');
let history=JSON.parse(localStorage.getItem('history')||'[]');

const items={"420-098.001-013":"Schraube M1.7 xyz69"};

function setQty(v){document.getElementById('qty').value=v;}

async function toggleCamera(){
  try{
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
      video.srcObject=null;
      status.innerText="Kamera aus";
      return;
    }

    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream;
    track=stream.getVideoTracks()[0];

    await video.play();
    status.innerText="Kamera aktiv";
  }catch(e){
    status.innerText="Kamera Fehler";
  }
}

function getCropCanvas(){
  const rect=overlay.getBoundingClientRect();
  const vRect=video.getBoundingClientRect();

  if(!video.videoWidth||!video.videoHeight) return document.createElement('canvas');

  const sx=video.videoWidth/vRect.width;
  const sy=video.videoHeight/vRect.height;

  const c=document.createElement('canvas');
  c.width=rect.width*sx;
  c.height=rect.height*sy;

  const ctx=c.getContext('2d');
  ctx.drawImage(video,
    (rect.left-vRect.left)*sx,
    (rect.top-vRect.top)*sy,
    rect.width*sx,
    rect.height*sy,
    0,0,c.width,c.height);

  return c;
}

function preprocess(c){
  let ctx=c.getContext('2d');
  let d=ctx.getImageData(0,0,c.width,c.height);

  for(let i=0;i<d.data.length;i+=4){
    let g=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
    let v=g>150?255:0;
    d.data[i]=d.data[i+1]=d.data[i+2]=v;
  }
  ctx.putImageData(d,0,0);
  return c;
}

// stabile aber deaktivierte Perspektivkorrektur (Fix für Crash)
function warp(canvas){
  return canvas;
}

async function scan(){
  if(!stream) return;

  let c=getCropCanvas();
  c=preprocess(c);
  c=warp(c);

  let res=await Tesseract.recognize(c,'eng',{tessedit_char_whitelist:'0123456789.-'});

  let t=res.data.text.replace(/[^0-9.-]/g,'');
  let m=t.match(/\d{3}-\d{3}\.\d{3}-\d{3}/);

  if(m){
    document.getElementById('manual').value=m[0];
    status.innerText=items[m[0]]||"Unbekannt";
  }
}

async function submitData(){
  let n=document.getElementById('manual').value;
  let q=document.getElementById('qty').value;

  if(!n||!q){status.innerText="fehlend";return;}

  let p={number:n,qty:q};

  history.push(p);
  localStorage.setItem('history',JSON.stringify(history));

  try{
    await fetch('YOUR_MS365_ENDPOINT',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
    status.innerText="gesendet";
  }catch(e){
    buffer.push(p);
    localStorage.setItem('buffer',JSON.stringify(buffer));
  }
}

setInterval(async()=>{
  if(buffer.length===0)return;
  try{
    for(let i of buffer){
      await fetch('YOUR_MS365_ENDPOINT',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(i)});
    }
    buffer=[];
    localStorage.setItem('buffer','[]');
  }catch(e){}
},10000);
</script>
</body>
</html>
