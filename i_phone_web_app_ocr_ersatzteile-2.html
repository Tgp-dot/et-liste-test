<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OCR Ersatzteile</title>

<script src="tesseract.min.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0a0a0a;
  color:#fff;
  touch-action:none;
}

#topStatus {
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 12px;
  border-radius:10px;
  background:rgba(0,0,0,0.6);
  font-size:14px;
  z-index:20;
  text-align:center;
  min-width:60%;
}

#videoContainer {
  position:relative;
  width:100vw;
  height:50vh;
  overflow:hidden;
  background:#000;
}

#video {
  width:100%;
  height:100%;
  object-fit:cover;
}

#overlay {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border:3px solid #E20612;
  border-radius:12px;
  width:60%;
  height:25%;
  pointer-events:none;
}

#controls {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(20,20,20,0.92);
  padding:12px;
}

.row { display:flex; gap:8px; }

input, button {
  width:100%; margin-top:6px;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
}

button { background:#E20612; color:white; }
.qtyBtn { flex:1; background:#333; }

#history { max-height:90px; overflow:auto; font-size:12px; margin-top:6px; }
.item { border-bottom:1px solid #333; padding:4px; }
</style>
</head>
<body>

<div id="topStatus">Bereit</div>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <div id="overlay"></div>
</div>

<div id="controls">
  <button onclick="toggleCamera()">Kamera EIN/AUS</button>

  <input id="manual" placeholder="Bestellnummer">

  <div class="row">
    <input id="qty" type="number" placeholder="Menge">
    <button class="qtyBtn" onclick="setQty(10)">10</button>
    <button class="qtyBtn" onclick="setQty(50)">50</button>
    <button class="qtyBtn" onclick="setQty(100)">100</button>
  </div>

  <button onclick="scan()">Scannen</button>
  <button onclick="submitData()">Senden</button>

  <div id="history"></div>
</div>

<script>
let video=document.getElementById('video');
let overlay=document.getElementById('overlay');
let status=document.getElementById('topStatus');
let stream=null;
let track=null;

let buffer=JSON.parse(localStorage.getItem('buffer')||'[]');
let history=JSON.parse(localStorage.getItem('history')||'[]');

const items={"420-098.001-013":"Schraube M1.7 xyz69"};

function setQty(v){document.getElementById('qty').value=v;}

async function toggleCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;status.innerText="Kamera aus";return;}
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  video.srcObject=stream;
  track=stream.getVideoTracks()[0];
  status.innerText="Kamera aktiv";
}

function getCropCanvas(){
  const rect=overlay.getBoundingClientRect();
  const vRect=video.getBoundingClientRect();

  const sx=video.videoWidth/vRect.width;
  const sy=video.videoHeight/vRect.height;

  const c=document.createElement('canvas');
  c.width=rect.width*sx;
  c.height=rect.height*sy;

  const ctx=c.getContext('2d');
  ctx.drawImage(video,
    (rect.left-vRect.left)*sx,
    (rect.top-vRect.top)*sy,
    rect.width*sx,
    rect.height*sy,
    0,0,c.width,c.height);

  return c;
}

function preprocess(c){
  let ctx=c.getContext('2d');
  let d=ctx.getImageData(0,0,c.width,c.height);

  for(let i=0;i<d.data.length;i+=4){
    let g=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
    let v=g>150?255:0;
    d.data[i]=d.data[i+1]=d.data[i+2]=v;
  }
  ctx.putImageData(d,0,0);
  return c;
}

function warp(canvas){
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  const src=ctx.getImageData(0,0,w,h);

  const gray=(i)=> (src.data[i]+src.data[i+1]+src.data[i+2])/3;

  let pts=[];
  for(let y=0;y<h;y+=4){
    for(let x=0;x<w;x+=4){
      let i=(y*w+x)*4;
      if(gray(i)<120) continue;
      pts.push({x,y});
    }
  }

  if(pts.length<20) return canvas;

  let tl=pts.reduce((a,p)=>p.x+p.y<a.x+a.y?p:a);
  let tr=pts.reduce((a,p)=>p.x-p.y>a.x-a.y?p:a);
  let bl=pts.reduce((a,p)=>p.y-p.x>a.y-a.x?p:a);
  let br=pts.reduce((a,p)=>p.x+p.y>a.x+a.y?p:a);

  function solve(p){
    const [p1,p2,p3,p4]=p;
    const W=w,H=h;

    let A=[],b=[];

    function eq(px,py,ux,uy){
      A.push([px,py,1,0,0,0,-ux*px,-ux*py]);b.push(ux);
      A.push([0,0,0,px,py,1,-uy*px,-uy*py]);b.push(uy);
    }

    eq(p1.x,p1.y,0,0);
    eq(p2.x,p2.y,W,0);
    eq(p3.x,p3.y,W,H);
    eq(p4.x,p4.y,0,H);

    let M=A.map((r,i)=>r.concat([b[i]]));

    for(let i=0;i<8;i++){
      let max=i;
      for(let j=i+1;j<8;j++) if(Math.abs(M[j][i])>Math.abs(M[max][i])) max=j;
      [M[i],M[max]]=[M[max],M[i]];

      for(let j=i+1;j<8;j++){
        let f=M[j][i]/M[i][i];
        for(let k=i;k<9;k++) M[j][k]-=f*M[i][k];
      }
    }

    let x=new Array(8).fill(0);
    for(let i=7;i>=0;i--){
      let s=M[i][8];
      for(let j=i+1;j<8;j++) s-=M[i][j]*x[j];
      x[i]=s/M[i][i];
    }

    return x;
  }

  let h=solve([tl,tr,br,bl]);
  if(!h) return canvas;

  let out=document.createElement('canvas');
  out.width=w;
  out.height=h;
  let octx=out.getContext('2d');
  let outData=octx.createImageData(w,h);

  function map(x,y){
    let d=1/(h[6]*x+h[7]*y+1);
    return {
      x:(h[0]*x+h[1]*y+h[2])*d,
      y:(h[3]*x+h[4]*y+h[5])*d
    };
  }

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let p=map(x,y);
      let ix=Math.floor(p.x),iy=Math.floor(p.y);
      if(ix<0||iy<0||ix>=w||iy>=h) continue;
      let i=(iy*w+ix)*4;
      let o=(y*w+x)*4;
      outData.data[o]=src.data[i];
      outData.data[o+1]=src.data[i+1];
      outData.data[o+2]=src.data[i+2];
      outData.data[o+3]=255;
    }
  }

  octx.putImageData(outData,0,0);
  return out;
}

async function scan(){
  if(!stream) return;
  let c=getCropCanvas();
  c=preprocess(c);
  c=warp(c);

  let res=await Tesseract.recognize(c,'eng',{tessedit_char_whitelist:'0123456789.-'});

  let t=res.data.text.replace(/[^0-9.-]/g,'');
  let m=t.match(/\d{3}-\d{3}\.\d{3}-\d{3}/);

  if(m){
    document.getElementById('manual').value=m[0];
    status.innerText=items[m[0]]||"Unbekannt";
  }
}

async function submitData(){
  let n=document.getElementById('manual').value;
  let q=document.getElementById('qty').value;

  if(!n||!q){status.innerText="fehlend";return;}

  let p={number:n,qty:q};

  history.push(p);
  localStorage.setItem('history',JSON.stringify(history));

  try{
    await fetch('YOUR_MS365_ENDPOINT',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
    status.innerText="gesendet";
  }catch(e){
    buffer.push(p);
    localStorage.setItem('buffer',JSON.stringify(buffer));
  }
}

setInterval(async()=>{
  if(buffer.length===0)return;
  try{
    for(let i of buffer){
      await fetch('YOUR_MS365_ENDPOINT',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(i)});
    }
    buffer=[];
    localStorage.setItem('buffer','[]');
  }catch(e){}
},10000);

</script>
</body>
</html>
